<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Intro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      cursor: pointer;
      z-index: 10;
    }

    #play-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 3px solid rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }

    #overlay:hover #play-icon {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
    }

    #play-icon svg {
      width: 40px;
      height: 40px;
      fill: #fff;
      margin-left: 6px; /* optical centering for play triangle */
    }

    #video-container {
      position: fixed;
      inset: 0;
      display: none;
    }

    #main-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #audio-player {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Click overlay -->
  <div id="overlay">
    <div id="play-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
    </div>
  </div>

  <!-- Full-screen video -->
  <div id="video-container">
    <video id="main-video" playsinline>
      <source src="video.mp4" type="video/x-matroska" />
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Audio that plays after video -->
  <audio id="audio-player" src="audio.mpeg"></audio>

  <script>
    const overlay       = document.getElementById('overlay');
    const videoContainer = document.getElementById('video-container');
    const video         = document.getElementById('main-video');
    const audio         = document.getElementById('audio-player');

    overlay.addEventListener('click', function () {
      // Hide overlay, show video
      overlay.style.display = 'none';
      videoContainer.style.display = 'block';

      // Play video and audio together
      video.play().catch(function (err) {
        console.warn('Video play failed:', err);
      });

      audio.play().catch(function (err) {
        console.warn('Audio play failed:', err);
      });
    });

    // When video ends, redirect
    video.addEventListener('ended', function () {
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
